<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Accoly</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <!-- Header -->
        <div class="auth-header">
            <div class="auth-icon">🎓</div>
            <h1>Accoly</h1>
            <p>Join Future Accountants</p>
            <p style="font-size:0.85rem;color:var(--text-secondary);margin:0.35rem 0 0;">Accoly Technologies</p>
        </div>

        <!-- Signup Form -->
        <div class="auth-card">
            <h2>Create Account</h2>
            <p class="auth-subtitle">Start your accounting journey today</p>

            <form id="signupForm" class="auth-form">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="John Doe" required>
                    <small class="field-error" id="fullNameError"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="student@university.edu" required>
                    <small class="field-error" id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <small class="field-error" id="passwordError"></small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
                    <small class="field-error" id="confirmPasswordError"></small>
                </div>

                <div id="error-message" class="error-message" style="display: none;"></div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                    Sign Up
                </button>

                <p class="auth-footer">
                    Already have an account? <a href="login.html">Sign In</a>
                </p>
            </form>
        </div>

        <!-- Footer -->
        <p class="auth-footer-text">Accoly Technologies</p>
    </div>
    <script src="js/sw-register.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
