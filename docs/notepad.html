<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Notepad - Accoly</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="modules.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h2>Accoly</h2>
                <p style="font-size: 0.75rem; margin: 0; color: var(--text-secondary);">Accoly Technologies</p>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span><span>Dashboard</span></a>
                <a href="notes.html" class="nav-item"><span class="nav-icon">📄</span><span>PDF</span></a>
                <a href="community.html" class="nav-item"><span class="nav-icon">🧑‍🤝‍🧑</span><span>Community</span></a>
                <a href="quiz.html" class="nav-item"><span class="nav-icon">🎮</span><span>Quiz Center</span></a>
                <a href="notepad.html" class="nav-item active"><span class="nav-icon">✏️</span><span>Notepad</span></a>
                <a href="flashcards.html" class="nav-item"><span class="nav-icon">🧠</span><span>Flashcards</span></a>
                <a href="leaderboard.html" class="nav-item"><span class="nav-icon">🏆</span><span>Leaderboard</span></a>
                <a href="messages.html" class="nav-item"><span class="nav-icon">💬</span><span>Messages</span></a>
                <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span><span>Profile</span></a>
                <a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span><span>Settings</span></a>
            </nav>
            <div class="sidebar-logout">
                <button type="button" onclick="logout()" class="btn btn-outline" style="width: 100%;">Logout</button>
            </div>
        </aside>

        <main class="dashboard-main">
            <header class="top-bar">
                <h1 class="module-page-title">Digital Notepad</h1>
                <div class="top-bar-right top-bar-actions">
                    <div class="dropdown-shell dropdown-shell--notif">
                        <button type="button" class="icon-btn nav-notif-btn" id="navNotifBtn" aria-label="Notifications" aria-expanded="false" aria-haspopup="true">🔔</button>
                        <span class="nav-badge" id="navNotifBadge" hidden aria-hidden="true">0</span>
                        <div class="nav-dropdown nav-dropdown--notif" id="navNotifPanel" role="menu" hidden>
                            <div class="nav-dropdown-title">Notifications</div>
                            <ul class="nav-dropdown-list" id="navNotifList"></ul>
                        </div>
                    </div>
                    <div class="dropdown-shell dropdown-shell--user">
                        <button type="button" class="user-menu-trigger" id="navUserBtn" aria-label="Account menu" aria-expanded="false" aria-haspopup="true">
                            <span class="user-avatar" id="navUserAvatar">U</span>
                            <span class="user-menu-name" id="navUserName">User</span>
                            <span class="nav-chevron" aria-hidden="true">▾</span>
                        </button>
                        <div class="nav-dropdown nav-dropdown--user" id="navUserPanel" role="menu" hidden>
                            <a href="profile.html" class="nav-dropdown-item">Profile</a>
                            <a href="settings.html" class="nav-dropdown-item">Settings</a>
                            <button type="button" class="nav-dropdown-item nav-dropdown-item--danger" id="navLogoutBtn">Logout</button>
                        </div>
                    </div>
                </div>
            </header>

            <div class="dashboard-content">
                <div id="notepadShell" class="notepad-shell">
                    <div class="notepad-toolbar" aria-label="Drawing tools">
                        <div class="tool-group">
                            <span style="font-size: 0.75rem; color: var(--text-secondary); margin-right: 0.25rem;">Subject</span>
                            <select id="notepadSubjectSelect" class="sort-select" aria-label="Notepad subject" style="min-width: 10rem;">
                                <option value="FAR">FAR — Financial Accounting and Reporting</option>
                                <option value="AFAR">AFAR — Advanced Financial Accounting and Reporting</option>
                                <option value="MS">MS — Management Services</option>
                                <option value="AUD">AUD — Auditing</option>
                                <option value="RFBT">RFBT — Regulatory Framework and Business Transactions</option>
                                <option value="TAX">TAX — Taxation</option>
                            </select>
                        </div>
                        <div class="tool-group">
                            <span style="font-size: 0.75rem; color: var(--text-secondary); margin-right: 0.25rem;">Tools</span>
                            <button type="button" class="tool-btn active" data-tool="pencil">Pencil</button>
                            <button type="button" class="tool-btn" data-tool="pen">Pen</button>
                            <button type="button" class="tool-btn" data-tool="highlighter">Highlighter</button>
                            <button type="button" class="tool-btn" data-tool="eraser">Eraser</button>
                        </div>
                        <div class="tool-group">
                            <span style="font-size: 0.75rem; color: var(--text-secondary); margin-right: 0.25rem;">Background</span>
                            <select id="bgSelect" class="sort-select" aria-label="Background">
                                <option value="white">White</option>
                                <option value="grid">Grid</option>
                                <option value="canvas">Canvas</option>
                            </select>
                        </div>
                        <div class="tool-group">
                            <span style="font-size: 0.75rem; color: var(--text-secondary);">Color</span>
                            <button type="button" class="color-swatch active" data-color="#1E3A8A" style="background:#1E3A8A;" title="Blue" aria-label="Blue"></button>
                            <button type="button" class="color-swatch" data-color="#0F172A" style="background:#0F172A;" title="Black" aria-label="Black"></button>
                            <button type="button" class="color-swatch" data-color="#DC2626" style="background:#DC2626;" title="Red" aria-label="Red"></button>
                            <button type="button" class="color-swatch" data-color="#CA8A04" style="background:#CA8A04;" title="Yellow" aria-label="Yellow"></button>
                            <input type="color" id="freeColor" value="#1E3A8A" class="color-picker" aria-label="Custom color" />
                        </div>
                        <div class="brush-slider-wrap">
                            <label for="brushSize">Size</label>
                            <input type="range" id="brushSize" class="brush-slider" min="1" max="40" value="12" aria-label="Brush size">
                        </div>
                        <div class="tool-group">
                            <button type="button" class="tool-btn" id="btnUndo" title="Undo">Undo</button>
                            <button type="button" class="tool-btn" id="btnRedo" title="Redo">Redo</button>
                        </div>
                        <div class="tool-group">
                            <input type="file" id="notepadUploadInput" accept="image/*" hidden />
                            <button type="button" class="btn btn-outline" id="btnUploadNotepad" style="padding:0.35rem 0.65rem;font-size:0.85rem;">Upload note</button>
                            <button type="button" class="btn btn-outline" id="btnNotepadFullscreen" style="padding:0.35rem 0.65rem;font-size:0.85rem;">Full canvas</button>
                        </div>
                    </div>

                    <div class="notepad-body">
                        <aside class="saved-pages" aria-label="Saved canvases">
                            <h3>Saved pages</h3>
                            <button type="button" class="btn btn-outline" id="btnNewPage" style="width:100%; margin-bottom:0.75rem;">+ New canvas</button>
                            <div id="savedList"></div>
                        </aside>

                        <div class="canvas-area">
                            <div class="canvas-stack" aria-label="Drawing canvas">
                                <canvas id="bgCanvas" width="1200" height="660" aria-hidden="true"></canvas>
                                <canvas id="drawingCanvas" width="1200" height="660"></canvas>
                            </div>
                            <div class="notepad-actions">
                                <button type="button" class="btn btn-outline" id="btnClear">Clear canvas</button>
                                <button type="button" class="btn btn-primary" id="btnSaveDrawing">Save drawing</button>
                                <button type="button" class="btn btn-outline" id="btnExportPng">Export PNG</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div><script src="js/sw-register.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/nav-header.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/subscription.js"></script>
    <script src="js/offline.js"></script>
    <script src="js/stats-utils.js"></script>
    <script src="js/notepad.js"></script>

    <div id="noteModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="noteModalTitle">
        <div class="modal-panel">
            <div class="modal-header">
                <h2 id="noteModalTitle">New Note</h2>
                <button type="button" class="modal-close" id="noteModalClose" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="noteTitle">Title</label>
                    <input type="text" id="noteTitle" class="form-input" placeholder="Note title" maxlength="200">
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="noteSubject">Subject</label>
                    <select id="noteSubject" class="form-select"></select>
                </div>
                <div class="form-group" style="margin-bottom: 0.5rem;">
                    <label for="noteContent">Content</label>
                    <textarea id="noteContent" class="form-textarea" placeholder="Write your note…"></textarea>
                </div>
                <p class="autosave-indicator" id="autosaveStatus" aria-live="polite"></p>
                <div class="note-pdf-row" id="notePdfRow" style="display:none;">
                    <div class="note-pdf-meta" id="notePdfMeta"></div>
                    <div class="note-pdf-actions">
                        <button type="button" class="btn btn-outline" id="noteViewPdfBtn">View PDF</button>
                        <button type="button" class="btn btn-outline" id="noteDetachPdfBtn">Detach</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="noteDeleteBtn" style="display: none; margin-right: auto;">Delete</button>
                <button type="button" class="btn btn-outline" id="noteCancelBtn">Close</button>
                <button type="button" class="btn btn-primary" id="noteSaveBtn">Save</button>
            </div>
        </div>
    </div>
</body>
</html>
