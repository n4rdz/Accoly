<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Accoly</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <!-- Header -->
        <div class="auth-header">
            <div class="auth-icon">🎓</div>
            <h1>Accoly</h1>
            <p>Your Premium Learning Partner</p>
        </div>

        <!-- Login Form -->
        <div class="auth-card">
            <h2>Sign In</h2>
            <p class="auth-subtitle">Welcome back to your learning journey</p>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="student@university.edu" required>
                    <small class="field-error" id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <small class="field-error" id="passwordError"></small>
                </div>

                <div id="error-message" class="error-message" style="display: none;"></div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                    Sign In
                </button>

                <p class="auth-footer">
                    Don't have an account? <a href="signup.html">Create One</a>
                </p>
            </form>
        </div>

        <!-- Footer -->
        <p class="auth-footer-text">Built for Future CPAs &amp; Accountants</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
